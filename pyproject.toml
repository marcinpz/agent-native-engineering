[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-native-engineering"
version = "0.1.0"
description = "Portable Living System Model schemas, validator and CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "jsonschema[format]>=4.23,<5",
 "PyYAML>=6.0.2,<7",
 "referencing>=0.36,<1",
]

[project.scripts]
lsm = "lsm.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/lsm"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
